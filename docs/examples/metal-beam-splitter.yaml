id: metal-beam-splitter
geometry: films
source: plane_wave
title: A silver beam splitter at 45°
caption: >-
  A thin silver film on glass at 45° incidence. Thicker silver reflects more and transmits less, and some light is
  always absorbed. Find the thickness where R and T cross near 550 nm.
plot:
  x_label: λ [nm]
  y_label: R, T, A
  series:
  - {key: R, label: R}
  - {key: T, label: T}
  - {key: A, label: A}
params:
- {id: silver, label: Silver, unit: nm, target: film.layers.0.thickness, scale: 0.001, min: 4, max: 30, step: 0.5, value: 13}
readouts:
- {label: "R at 550 nm", measure: {at: [R, 550]}}
- {label: "T at 550 nm", measure: {at: [T, 550]}}
- {label: "A at 550 nm", measure: {at: [A, 550]}}
checks:
- check: R + T + the silver's absorptance = 1 (largest departure)
  reference: 0
  tolerance: 1.0e-9
  source: Poynting's theorem
  measure: {balance: true}
calculator:
  film:
    incident: {label: Air, n: 1.0, k: 0.0}
    layers:
    - {label: Ag, n: 0.05, k: 3.0, thickness: 0.013, table: {name: "Ag (Johnson and Christy 1972), tutorials' table", file: docs/data/tutorials/Ag_Johnson.yml}}
    substrate: {label: Glass, n: 1.52, k: 0.0}
    controls: {wavelength-start: 400, wavelength-end: 800, wavelength-step: 5, angle-deg: 45}
    view: {polarization: average}
