id: low-e-coating
geometry: films
source: plane_wave
title: A ZnO / Ag / ZnO low-emissivity coating
caption: >-
  12 nm of silver between two 40 nm ZnO layers on glass. The visible passes; the near infrared is reflected. Thicken
  the silver and the infrared reflectance rises, at the cost of visible transmittance.
plot:
  x_label: λ [nm]
  y_label: T, R
  series:
  - {key: T, label: T}
  - {key: R, label: R}
params:
- {id: silver, label: Silver, unit: nm, target: film.layers.1.thickness, scale: 0.001, min: 6, max: 22, step: 0.5, value: 12}
readouts:
- {label: "mean T, 400–700 nm", measure: {mean: [T, [400, 700]]}}
- {label: "mean R, 1500–2500 nm", measure: {mean: [R, [1500, 2500]]}}
checks:
- check: R + T + the absorptance of every layer = 1 (largest departure)
  reference: 0
  tolerance: 1.0e-9
  source: Poynting's theorem
  measure: {balance: true}
calculator:
  film:
    incident: {label: Air, n: 1.0, k: 0.0}
    layers:
    - {label: ZnO, n: 2.0, k: 0.0, thickness: 0.04, rii: ZnO_Aguilar}
    - {label: Ag, n: 0.05, k: 3.0, thickness: 0.012, rii: Ag_Ciesielski}
    - {label: ZnO, n: 2.0, k: 0.0, thickness: 0.04, rii: ZnO_Aguilar}
    substrate: {label: Glass, n: 1.52, k: 0.0}
    controls: {wavelength-start: 300, wavelength-end: 2500, wavelength-step: 20}
    view: {polarization: average}
