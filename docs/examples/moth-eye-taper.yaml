id: moth-eye-taper
geometry: films
source: plane_wave
title: A moth-eye taper on glass
caption: >-
  A sub-wavelength glass taper 450 nm tall, sliced into 16 layers whose indices are the Bruggeman effective indices of
  the local glass fraction (a quintic profile, period 150 nm). The index rises from air to glass without a step, and
  the reflectance falls far below the 4.3 % of bare glass across the visible. Make the taper shorter than about a
  third of a wavelength and the step comes back.
plot:
  x_label: λ [nm]
  y_label: R
  series:
  - {key: R, label: R}
params:
- id: height
  label: Height
  unit: nm
  target:
  - film.layers.0.thickness
  - film.layers.1.thickness
  - film.layers.2.thickness
  - film.layers.3.thickness
  - film.layers.4.thickness
  - film.layers.5.thickness
  - film.layers.6.thickness
  - film.layers.7.thickness
  - film.layers.8.thickness
  - film.layers.9.thickness
  - film.layers.10.thickness
  - film.layers.11.thickness
  - film.layers.12.thickness
  - film.layers.13.thickness
  - film.layers.14.thickness
  - film.layers.15.thickness
  scale: 6.25e-05
  min: 50
  max: 1000
  step: 10
  value: 450
readouts:
- {label: "mean R, 400–700 nm", measure: {mean: [R, [400, 700]]}}
- {label: "R at 550 nm", measure: {at: [R, 550]}}
