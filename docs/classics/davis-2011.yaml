id: davis-2011
kind: classic
position: 8
geometry: cylinders
title: An FT-IR microscope looking at a fiber
cite: B. J. Davis, P. S. Carney and R. Bhargava, Anal. Chem. 83, 525 (2011)
doi: 10.1021/ac102239b
figure: 'Fig. 5a: transmission through a non-absorbing fiber of radius 5 µm, n0 = 1.477'
shows: >-
  Apparent absorbance of a fiber that absorbs nothing, under a Cassegrain (NA 0.1–0.4) from 4000 to 800 cm⁻¹: the refraction-and-scattering
  baseline that hides real bands.
inputs: >-
  Fiber n = 1.477 (Fig. 5 caption), radius 5 µm, in air. The paper does not state Fig. 5's aperture; NA 0.4 with a 0.1 obscuration
  (its Fig. 2) reproduces the shape.
note: >-
  Transmission minimum {R = 5 µm: transmission minimum (%)}% near {R = 5 µm: wavenumber of the minimum (cm-1)} cm⁻¹, a
  maximum of {R = 5 µm: maximum near the fit range, 1900-2600 cm-1 (%)}% between 1900 and 2600 cm⁻¹ and a dip to {R =
  5 µm: dip near 3000 cm-1 (%)}% near 3000 cm⁻¹, against ~{R = 5 µm: transmission minimum (%)|paper}%, ~{R = 5 µm:
  maximum near the fit range, 1900-2600 cm-1 (%)|paper}% and ~{R = 5 µm: dip near 3000 cm-1 (%)|paper}% read off Fig.
  5a.
perturb: 'Double the radius to 10 µm, as in Fig. 5b: the deep minimum near 1100 cm⁻¹ disappears.'
script: crosscheck/classics/davis_2011.py
results: crosscheck/classics/results/davis_2011.json
