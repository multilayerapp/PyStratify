title: Coherent film, incoherent wafer
cite: C. C. Katsidis and D. I. Siapkas, Appl. Opt. 41, 3978 (2002)
doi: 10.1364/AO.41.003978
figure: 'Fig. 2: infrared reflectance of 2 µm SiC on a 300 µm Si wafer, finite incoherent or semi-infinite'
shows: >-
  Reflectance from 1.43 to 14.3 µm (7000 to 700 cm⁻¹): film fringes riding on the wafer's back-face reflection, and the SiC
  reststrahlen band.
inputs: >-
  SiC from the paper's oscillator (ε∞ 6.7, Δε 3.3, ω_TO 796.5 cm⁻¹, γ 20 cm⁻¹) as an uploaded table; Si n = 3.42, 300 µm,
  incoherent.
agreement: >-
  Fringe band 0.34–0.46 (incoherent wafer) and 0.09–0.30 (semi-infinite) against Fig. 2's ~0.33–0.50 and ~0.07–0.30; identical
  in the reststrahlen band.
perturb: >-
  Make the wafer the substrate instead of an incoherent layer: the whole level drops except between 790 and 870 cm⁻¹.
