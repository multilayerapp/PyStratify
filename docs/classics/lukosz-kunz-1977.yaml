  film:
    incident:
      label: Air
      n: 1.0
      k: 0.0
    layers: []
    substrate:
      label: Glass
      n: 1.5
      k: 0.0
    controls:
      wavelength-start: 600
      wavelength-end: 600
  envelope:
    kind: dipole
    region: origin
