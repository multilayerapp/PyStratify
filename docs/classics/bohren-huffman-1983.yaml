id: bohren-huffman-1983
kind: classic
position: 6
geometry: cylinders
title: 'The infinite cylinder: two polarizations'
cite: >-
  C. F. Bohren and D. R. Huffman, Absorption and Scattering of Light by Small Particles (Wiley, 1983), section 8.4
doi: 10.1002/9783527618156
figure: >-
  Fig. 8.7: scattering per unit volume of a glass-like cylinder against diameter, polarized parallel and perpendicular to
  its axis
shows: >-
  Scattering efficiency of a non-absorbing cylinder (n = 1.55, in air, 632.8 nm) swept from 10 nm to 1.5 µm in radius, for
  light polarized along the axis; switch to the perpendicular polarization to see the textbook difference.
inputs: >-
  n = 1.55, λ = 0.6328 µm, air, normal incidence (p. 207). The book plots C_sca/V = 4Q/(πd); the calculator shows the efficiency
  Q.
note: >-
  The parallel maxima {parallel: first maximum}, {parallel: second maximum}, {parallel: highest maximum} and
  {parallel: shoulder after it} (×10⁴ cm⁻¹), the highest at {parallel: diameter of the highest maximum (µm)} µm
  diameter, and the perpendicular {perpendicular: maximum} at {perpendicular: diameter of the maximum (µm)} µm,
  against ~{parallel: first maximum|paper}, {parallel: second maximum|paper}, {parallel: highest maximum|paper},
  {parallel: shoulder after it|paper} and {perpendicular: maximum|paper} read off Fig. 8.7.
perturb: >-
  Make the cylinder absorbing (k = 0.05): the ripple dies and both polarizations fall toward the geometric limit Q = 2.
