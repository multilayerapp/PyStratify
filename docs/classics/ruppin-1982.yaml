geometry: spheres
title: A molecule beside a small silver sphere
cite: R. Ruppin, J. Chem. Phys. 76, 1681 (1982)
doi: 10.1063/1.443196
figure: 'Figs. 1–2: lifetime of a molecule against its distance from a silver sphere of radius 10 nm'
shows: >-
  Decay rates of an electric dipole at 612 nm moving away from a 10 nm silver sphere in a medium of n = 1.5, radial and tangential.
inputs: >-
  Radius 10 nm, host ε = 2.25, λ = 612 nm (printed); Johnson & Christy silver (the paper prints none), which puts the dipole
  plasmon at the paper's 3.05 eV.
agreement: >-
  Lifetime (the inverse of the total rate) 0.98 at kd = 1 and no oscillation beyond; tangential maximum 1.16 at kd = 0.19
  (paper ~1.12 at ~0.2).
perturb: 'Switch the axis to wavelength at a fixed 10 nm gap: the l = 1 plasmon appears at ~407 nm (3.05 eV).'
