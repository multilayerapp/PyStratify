[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pystratify"
version = "0.11.0"
description = "Unified modal response for multilayered films, cylinders and spheres, under plane waves, point dipoles and focused beams; thin-film ellipsometry with dispersion models and fitting"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]
authors = [{ name = "Ilia Rasskazov" }]
keywords = ["Mie theory", "multilayered sphere", "transfer matrix", "thin films", "cylinder scattering",
            "light scattering", "decay rates", "Purcell effect", "focused beam", "infrared microspectroscopy",
            "nanophotonics", "plasmonics", "ellipsometry", "dispersion models", "Tauc-Lorentz",
            "optical constants"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://multilayer.app"
Documentation = "https://github.com/multilayerapp/PyStratify/blob/main/docs/GUIDE.md"
Source = "https://github.com/multilayerapp/PyStratify"
Issues = "https://github.com/multilayerapp/PyStratify/issues"
Changelog = "https://github.com/multilayerapp/PyStratify/blob/main/CHANGELOG.md"
Verification = "https://multilayer.app/verification.html"
DOI = "https://doi.org/10.5281/zenodo.23287561"

[project.optional-dependencies]
test = ["pytest>=7", "mpmath>=1.3", "treams>=0.4", "pyyaml>=6"]
references = ["mpmath>=1.3"]
docs = ["pyyaml>=6"]
benchmarks = ["PyMoosh>=4.0", "pyElli>=0.23", "lmfit>=1.2", "scattnlay>=2.4", "treams>=0.4", "pyGDM2>=1.1", "meent>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# `l` is the multipole order throughout, as in the literature
ignore = ["E741"]

[tool.setuptools.package-data]
pystratify = ["PLANAR-LICENSE.txt"]
