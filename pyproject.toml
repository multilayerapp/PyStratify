[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pystratify"
version = "0.10.2"
description = "Unified modal response for multilayered films, cylinders and spheres, under plane waves, point dipoles and focused beams"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7", "mpmath>=1.3", "treams>=0.4"]
references = ["mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# `l` is the multipole order throughout, as in the literature
ignore = ["E741"]

[tool.setuptools.package-data]
pystratify = ["PLANAR-LICENSE.txt"]
